server:
  port: 8080
  servlet:
    session:
      # 只用 Cookie 传会话，别把 jsessionid 拼到 URL 上
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        name: DR_SESSION

spring:
  application:
    name: daily-reading
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/daily_reading?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    # 本地默认值，可用环境变量覆盖，避免把真实密码写死在仓库里
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  thymeleaf:
    cache: false
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 32MB
  web:
    resources:
      static-locations: classpath:/static/

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.dailyreading.entity

logging:
  level:
    com.dailyreading: debug

# 应用自己的配置。
# 真实 Key 放在 application-local.yml（已在 .gitignore 里），不提交。
app:
  ocr:
    # mock = 不调用任何外部服务，返回 mock-words 里的词，用来跑通链路
    # baidu = 调用百度云通用文字识别（需要真实 Key）
    provider: mock
    mock-words: abandon,procedure,reluctant,cautious,vivid,witness,harvest,modest
  deepseek:
    # 留空则无法生成文章；填了就走真实调用
    api-key: ""
    base-url: https://api.deepseek.com
    model: deepseek-chat
