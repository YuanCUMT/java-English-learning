<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今天这一篇 · 每日阅读</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/workspace.css}">
</head>
<body>

<header class="topbar">
  <div class="wrap inner">
    <div class="brand">
      <span class="mark">D/R</span>
      <span>每日阅读</span>
    </div>
    <nav>
      <a class="active" th:href="@{/}">今日文章</a>
      <a href="/archive">历史文章</a>
      <a href="/vocab">单词本</a>
      <span th:text="${username}">用户</span>
      <a th:href="@{/logout}">退出</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="eyebrow">Today / 今天</div>
    <h1>今天这一篇</h1>
    <p>把今天背的词读成一篇真题——截图导入、AI 成文、点词即查。</p>
  </section>

  <section class="stats">
    <div class="stat">
      <div class="num" id="statWords" th:text="${todayWords}">0</div>
      <div class="label">今日单词</div>
    </div>
    <div class="stat">
      <div class="num" th:text="${totalWords}">0</div>
      <div class="label">累计单词</div>
    </div>
    <div class="stat">
      <div class="num" th:text="${learningMarks}">0</div>
      <div class="label">生词·学习中</div>
    </div>
    <div class="stat">
      <div class="num" th:text="${articles}">0</div>
      <div class="label">历史文章</div>
    </div>
  </section>

  <!-- 一、导入：把截图拖进来，或者粘贴词表 -->
  <section class="panel import-panel" id="importPanel">
    <div class="panel-head">
      <span class="panel-code">01 / import</span>
      <span class="panel-title">导入今天要背的词</span>
      <span class="spacer"></span>
      <span class="hint" id="ocrHint">识别引擎：加载中…</span>
    </div>
    <div class="import-body">
      <div class="import-drop" id="importDrop">
        <div class="drop-icon" aria-hidden="true">↓</div>
        <p class="drop-title">把单词截图拖到这里</p>
        <p class="hint">也可以直接 Ctrl+V 粘贴，或者选一张图</p>
        <label class="btn ghost file-btn">
          选图识别
          <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp" hidden>
        </label>
      </div>
      <div class="import-paste">
        <label class="field-label" for="pasteText">或者粘贴词表</label>
        <textarea id="pasteText" rows="4" placeholder="把今天的词表粘进来，英文单词会被自动抽出来（一行一个、用逗号或空格隔开都行）"></textarea>
        <button class="btn primary" id="btnPaste" type="button">导入这些词</button>
      </div>
    </div>
  </section>

  <div class="workspace">
    <!-- 二、今日单词 -->
    <aside class="panel words-panel">
      <div class="panel-head">
        <span class="panel-code">02 / words</span>
        <span class="panel-title">今日单词 <b id="wordCount" th:text="${todayWords}">0</b></span>
        <button class="mini" id="btnClearWords" type="button">清空</button>
      </div>
      <div class="words-filter">
        <input class="mini-input" id="wordFilter" type="search" placeholder="搜索今天的单词" autocomplete="off">
      </div>
      <div class="chips" id="wordList"></div>
    </aside>

    <!-- 三、文章 -->
    <section class="panel article-panel">
      <div class="panel-head">
        <span class="panel-code">03 / article</span>
        <span class="panel-title">今天这一篇</span>
        <span class="spacer"></span>
        <select class="mini-select" id="genMode" title="文章模式">
          <option value="review">复习模式</option>
          <option value="exam">真题模式</option>
        </select>
        <select class="mini-select" id="genDifficulty" title="文章难度">
          <option value="B2" title="句子 12–18 词，不出超纲词">简单 · 句子短、生词少</option>
          <option value="C1" selected title="平均句长 20–28 词，含长难句，考研英语一真题难度">中等 · 考研英语一难度</option>
          <option value="C2" title="平均句长 26–38 词，抽象名词多，可有少量超纲词">困难 · 长难句多、偏抽象</option>
        </select>
        <button class="btn primary" id="btnGenerate" type="button" disabled>生成文章</button>
      </div>
      <div class="article-placeholder" id="articleBox">
        <p><b>还没有文章。</b></p>
        <p class="hint">先在上面导入今天的单词，再点「生成文章」。</p>
      </div>
      <div class="article-body" id="articleBody" hidden></div>
      <div class="article-loading" id="articleLoading" hidden>
        <div class="dots"><i></i><i></i><i></i></div>
        <p class="hint" id="articleLoadingHint">正在写文章，大约 20–40 秒……</p>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast" hidden></div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/article.js}"></script>
</body>
</html>
